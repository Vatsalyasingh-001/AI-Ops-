[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ops-agent"
version = "0.1.0"
description = "Framework-agnostic deterministic incident investigation agent"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5", "litellm>=1.60,<2", "pydantic>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]