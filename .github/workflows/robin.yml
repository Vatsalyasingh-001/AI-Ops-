name: Robin CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  robin-review:
    name: Review pull request with Robin
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == false

    env:
      OPEN_ROUTER: ${{ secrets.OPEN_ROUTER }}
      BASE_URL: ${{ secrets.BASE_URL }}
      NVIDIA_NEMOTRON: ${{ secrets.NVIDIA_NEMOTRON }}
      LLM_API_KEY: ${{ secrets.OPEN_ROUTER }}
      LLM_BASE_URL: ${{ secrets.BASE_URL }}
      LLM_MODEL: ${{ secrets.NVIDIA_NEMOTRON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required Robin configuration
        shell: bash
        run: |
          for var in OPEN_ROUTER BASE_URL NVIDIA_NEMOTRON; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret or environment variable: ${var}"
              exit 1
            fi
          done

          if [ -z "$LLM_API_KEY" ] || [ -z "$LLM_BASE_URL" ] || [ -z "$LLM_MODEL" ]; then
            echo "::error::One or more Robin secrets were not populated in the workflow environment."
            exit 1
          fi

      - name: Run Robin review
        id: robin
        shell: bash
        run: |
          chmod +x ./robin
          ./robin > robin-review.md 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Publish review to PR
        if: github.event_name == 'pull_request' && github.event.pull_request.number != '' && steps.robin.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -s robin-review.md ]; then
            echo "::error::Robin produced no review output."
            exit 1
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --body-file robin-review.md

      - name: Fail on Robin execution errors
        if: steps.robin.outputs.status != '0'
        shell: bash
        run: |
          echo "::error::Robin could not complete the review."
          if [ -f robin-review.md ]; then
            cat robin-review.md
          fi
          exit 1
